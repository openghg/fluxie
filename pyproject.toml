[build-system]
requires = ["hatchling >= 1.26", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "fluxie"
dynamic = ["version"]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "xarray>=2023.08",
  "h5py",
  "h5netcdf",
  "geopandas",
  "PyYAML",
]
requires-python = ">=3.10"

authors = [
  {name = "FLUXIE developers"},
]
maintainers = [
  {name = "FLUXIE maintainers"},
]
description = "Inverse modelling intercomparison tool"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["inverse modelling", "greenhouse gases", "emission fluxes", "mole fractions"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
docs = [
  "zensical",
  "mkdocstrings[python]",
]
dev = [
  "pytest",
  "black",
  # Docstring and type hint checks, configured below
  "ruff",
  "pydoclint",
  # To execute the example notebooks
  "nbconvert",
  "ipykernel",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[project.urls]
Homepage = "https://github.com/openghg/fluxie"
Documentation = "https://fluxie.readthedocs.io"
Repository = "https://github.com/openghg/fluxie"
"Bug Tracker" = "https://github.com/openghg/fluxie/issues"
"PARIS project" = "https://horizoneurope-paris.eu/"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Only docstrings (D) and type hints (ANN) are checked, formatting is done by black
select = ["D", "ANN"]
# fluxie docstrings start on the line after the opening quotes
extend-select = ["D213"]
ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in __init__
  "D212", # Multi-line summary should start at the first line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.pydoclint]
style = "google"
# Types are given in the signature only, not in the docstring
arg-type-hints-in-signature = true
arg-type-hints-in-docstring = false
check-return-types = false
# A docstring with only a summary is allowed (e.g. for small helper functions)
skip-checking-short-docstrings = true
skip-checking-raises = true
allow-init-docstring = true
check-class-attributes = false
