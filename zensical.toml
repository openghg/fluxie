[project]
site_name = "fluxie"
site_description = "Flux Intercomparison Environment"
site_url = "https://fluxie.readthedocs.io/"
repo_url = "https://github.com/openghg/fluxie"
repo_name = "openghg/fluxie"
edit_uri = "edit/devel/docs/"

# Python files of the docs folder are build scripts, not pages.
# Generated markdown files are included in other pages with snippets.
exclude_docs = """
*.py
__pycache__/
generated/*.md
"""

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "installation.md" },
    { "Quick start" = "quickstart.md" },
  ] },
  { "User guide" = [
    { "How fluxie works" = "user_guide/principles.md" },
    { "Input data format" = "user_guide/data_format.md" },
    { "Configuration files" = "user_guide/configuration.md" },
    { "Notebooks" = "user_guide/notebooks.md" },
  ] },
  { "Gallery" = "gallery.md" },
  { "API" = [
    "api/index.md",
    { "Plots" = "api/plots.md" },
    { "Input/Output" = "api/io.md" },
    { "Operators" = "api/operators.md" },
    { "Configuration" = "api/config.md" },
  ] },
  { "Developer guide" = [
    { "Contributing" = "developer/contributing.md" },
    { "Adding a plot function" = "developer/new_plot.md" },
    { "Tests" = "developer/tests.md" },
    { "Documentation" = "developer/docs.md" },
    { "Publishing a release" = "developer/publishing.md" },
  ] },
  { "About" = [
    { "Citing fluxie" = "citing.md" },
    { "Credits" = "credits.md" },
    { "Hall of fame" = "hall_of_fame.md" },
  ] },
]

[project.theme]
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
# Used to include CREDITS.md and the files generated by docs/build_pages.py
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
show_root_full_path = false
show_source = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
members_order = "source"
heading_level = 3
